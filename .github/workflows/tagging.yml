name: Release & Semantic Tagging

on:
  workflow_run:
    workflows: ["CI - Build ROS 2 workspace"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Generate Tag & Release
    runs-on: ubuntu-24.04
    # Only release commits whose CI completed successfully.  workflow_run runs
    # from the default branch, so use the triggering CI commit explicitly below
    # instead of accidentally tagging a newer commit on main.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          # workflow_run's default ref is the workflow's default branch, not
          # necessarily the commit that CI just tested.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Generate semantic tag
        id: tagger
        uses: anothrNick/github-tag-action@1.67.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          # A merge containing no explicit major/minor marker still represents
          # a releasable change.  The previous value (none) silently skipped
          # releases for ordinary feature merge commits.
          DEFAULT_BUMP: patch

      - name: Create GitHub Release
        if: steps.tagger.outputs.new_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tagger.outputs.new_tag }}
          name: Release ${{ steps.tagger.outputs.new_tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
