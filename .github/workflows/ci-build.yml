name: CI - Build ROS 2 workspace

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build ROS 2 Jazzy workspace
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy-ros-base

    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Install build tools and ROS dependencies
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-rosdep build-essential
          rosdep init || true
          rosdep update
          rosdep install --from-paths src --ignore-src --rosdistro jazzy -r -y

      - name: Build workspace
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-up-to interceptor --symlink-install --event-handlers console_direct+

      - name: Run tests
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test --packages-select interceptor --event-handlers console_direct+
          colcon test-result --verbose
