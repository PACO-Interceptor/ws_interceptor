name: Release & Semantic Tagging

on:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  tag:
    name: Generate Tag & Release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create semantic tag
        uses: anothrNick/github-tag-action@1.67.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          WITH_V: true