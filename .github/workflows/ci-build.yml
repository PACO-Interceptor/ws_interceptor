name: CI - Build Interceptor Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build ROS 2 Jazzy & PX4 Dependencies
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy-ros-base

    steps:
      # 1. Preparar la estructura del workspace y clonar tu paquete como 'interceptor'
      - name: Checkout interceptor repo
        uses: actions/checkout@v4
        with:
          path: src/interceptor

      # 2. Instalar herramientas de compilación, utilidades e inicializar rosdep
      - name: Instalar dependencias base
        run: |
          apt-get update
          apt-get install -y \
            python3-colcon-common-extensions \
            python3-rosdep \
            git \
            build-essential
          rosdep init || true
          for attempt in 1 2 3; do
            rosdep update && break
            if [ "$attempt" -eq 3 ]; then
              echo "rosdep update failed after ${attempt} attempts"
              exit 1
            fi
            echo "rosdep update failed (attempt ${attempt}), retrying..."
            sleep 10
          done

      # 3. Clonar los paquetes complementarios requeridos en src/
      - name: Clonar dependencias PX4 y Auterion
        run: |
          cd src
          git clone --depth 1 https://github.com/PX4/px4_msgs.git
          git clone --depth 1 https://github.com/PX4/px4_ros_com.git
          git clone --depth 1 https://github.com/Auterion/px4-ros2-interface-lib.git

      # 4. Resolver dependencias declaradas en todos los package.xml de src/
      - name: Instalar dependencias con rosdep
        run: |
          rosdep install --from-paths src --ignore-src -y -r --rosdistro jazzy

      # 5. Compilar el paquete interceptor y sus dependencias
      - name: Compilar con Colcon
        run: |
          . /opt/ros/jazzy/setup.sh
          colcon build --packages-up-to interceptor --symlink-install --event-handlers console_direct+

      # 6. Ejecutar tests (si existen)
      - name: Ejecutar Tests
        run: |
          . /opt/ros/jazzy/setup.sh
          colcon test --packages-select interceptor --event-handlers console_direct+